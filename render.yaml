services:
  - type: web
    name: resultscope
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_business.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: PROVIDER_NETWORK_ENABLED
        value: "false"
      - key: BUSINESS_EXTERNAL_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: BUSINESS_DATA_KEY
        sync: false
      - key: SESSION_SIGNING_KEY
        generateValue: true
      - key: DEMO_ACCESS_CODE
        sync: false
      # MongoDB Atlas Vector Search (optional, see the operating manual). Off until the
      # owner creates the Atlas cluster, allows Render's outbound IPs and runs the indexer.
      - key: VECTOR_SEARCH_ENABLED
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
