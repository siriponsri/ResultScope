<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResultScope architecture</title><style>body{margin:0;background:#f8f8ff}svg{display:block;width:100%;height:auto;max-width:1440px;margin:auto}@media print{svg{width:100%}}</style><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title description"><title id="title">ResultScope architecture</title><desc id="description">Local browser connects to FastAPI. Python controls routing and validation. Evidence and local state feed the application. External providers are behind an offline guard and atomic attempt budget; SystemOne observes only.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 7 4 0 7z" fill="#61586f"/></marker></defs><rect width="100%" height="100%" fill="#f8f8ff"/><style>text{font-family:Arial,sans-serif;fill:#21172f}.muted{fill:#61586f}.node{fill:white;stroke:#ded8e9;stroke-width:1.5}.edge{fill:none;stroke:#61586f;stroke-width:1.5;marker-end:url(#arrow)}.optional{stroke-dasharray:5 5}.heading{font-weight:600;font-size:32px;letter-spacing:-.8px}.label{font-size:17px;font-weight:600}.sub{font-size:13px;fill:#61586f}</style><text x="48" y="60" class="heading" text-anchor="start">A small application. Explicit trust boundaries.</text><text x="48" y="91" class="sub" text-anchor="start">Current implementation · product redesign based on c9236f5 · provider calls disabled in this package</text><rect x="340" y="140" width="504" height="624" rx="10" fill="#f1eef8" stroke="#d8cde7" stroke-dasharray="6 6"/><text x="360" y="168" class="sub" text-anchor="start">APPLICATION PROCESS AND LOCAL FILES</text><path d="M292 300 H372" class="edge"/><path d="M592 304 V344" class="edge"/><path d="M592 436 V472" class="edge"/><path d="M784 516 H880" class="edge"/><path d="M784 560 H828 Q836 560 836 568 V668 Q836 676 844 676 H880" class="edge optional"/><path
