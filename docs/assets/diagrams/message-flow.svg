<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" role="img" aria-labelledby="title description"><title id="title">One laboratory question: data flow</title><desc id="description">A question enters Python scope checks, retrieves allowed evidence, optionally observes SystemOne, and calls Typhoon only after a budget reservation. The response is validated before being sent to the browser.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 7 4 0 7z" fill="#61586f"/></marker></defs><rect width="100%" height="100%" fill="#f8f8ff"/><style>text{font-family:Arial,sans-serif;fill:#21172f}.muted{fill:#61586f}.node{fill:white;stroke:#ded8e9;stroke-width:1.5}.edge{fill:none;stroke:#61586f;stroke-width:1.5;marker-end:url(#arrow)}.optional{stroke-dasharray:5 5}.heading{font-weight:600;font-size:32px;letter-spacing:-.8px}.label{font-size:17px;font-weight:600}.sub{font-size:13px;fill:#61586f}</style><text x="48" y="60" class="heading" text-anchor="start">From question to a checked explanation.</text><text x="48" y="90" class="sub" text-anchor="start">Permitted question · conditional live path shown · network disabled by default</text><path d="M124 198 V764" stroke="#ded8e9" stroke-width="1.5" stroke-dasharray="4 6"/><path d="M352 198 V764" stroke="#ded8e9" stroke-width="1.5" stroke-dasharray="4 6"/><path d="M584 198 V764" stroke="#ded8e9" stroke-width="1.5" stroke-dasharray="4 6"/><path d="M816 198 V764" stroke="#ded8e9" stroke-width="1.5" stroke-dasharray="4 6"/><path d="M1064 198 V764" stroke="#ded8e9" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="28" y="132" width="192" height="60" rx="8" fill="#fff" stroke="#ded8e9" stroke-width="1.5"/><text x="48" y="163" class="label" text-anchor="start">Browser</text><rect x="256" y="132" width="192" height="60" rx="8" fill="#fff" stroke="#ded8e9" stroke-width="1.5"/><text x="276" y="163" class="label" text-anchor="start">Python / API</text><rect x="488" y="132" width="192" height="60" rx="8" fill="#fff" stroke="#ded8e9" stroke-width="1.5"/><text x="508" y="163" class="label" text-anchor="start">Evidence</text><rect x="720" y="132" width="192" height="60" rx="8" fill="#fff" stroke="#ded8e9" stroke-width="1.5"/><text x="740" y="163" class="label" text-anchor="start">Budget + HTTP</text><rect x="968" y="132" width="192" height="60" rx="8" fill="#fff" stroke="#ded8e9" stroke-width="1.5"/><text x="988" y="163" class="label" text-anchor="start">Providers</text><path d="M124 252 H352" class="edge"/><text x="238.0" y="240" class="sub" text-anchor="middle">Submit question</text><text x="374" y="293" class="sub" text-anchor="start">Scope + literal values</text><path d="M352 332 H584" class="edge"/><text x="468.0" y="320" class="sub" text-anchor="middle">Retrieve allowed evidence</text><path d="M584 388 H352" class="edge optional"/><text x="468.0" y="376" class="sub" text-anchor="middle">Records + provenance</text><path d="M352 452 H816" class="edge"/><text x="584.0" y="440" class="sub" text-anchor="middle">Prepare provider request</text><text x="692" y="493" class="sub" text-anchor="start">Guard + atomic reservation</text><path d="M816 532 H1064" class="edge"/><text x="940.0" y="520" class="sub" text-anchor="middle">Authorized attempt only</text><path d="M1064 588 H816" class="edge optional"/><text x="940.0" y="576" class="sub" text-anchor="middle">Untrusted provider output</text><path d="M816 644 H352" class="edge optional"/><text x="584.0" y="632" class="sub" text-anchor="middle">Candidate answer</text><text x="374" y="687" class="sub" text-anchor="start">Validate facts + citations</text><path d="M352 732 H124" class="edge optional"/><text x="238.0" y="720" class="sub" text-anchor="middle">Checked answer or safe refusal</text><text x="48" y="810" class="sub" text-anchor="start">SystemOne shadow may precede LLM generation; each external attempt has its own reservation.</text><text x="48" y="833" class="sub" text-anchor="start">Out-of-scope, offline, exhausted-budget and invalid-output paths stop without publishing unchecked text.</text></svg>